plugins {
	id 'fabric-loom' version '1.6.12'
}

// Release version is `mod_version` plus the game version, so the shipped jar is
// `blockbuster-3.0.0-port-1.20.1.jar`.
//
// The P216 release freeze had dropped that suffix (bare `blockbuster-3.0.0-port
// .jar`) because there was only ever one target. Now that the port is built for
// more than one game version, a bare name means the 1.20.4 and 1.20.1 branches
// both emit an identically-named jar — indistinguishable in a mods folder or on
// a download page, and one silently overwrites the other in build/libs. The
// suffix is back for that reason, matching the bbs-fs scheme.
//
// Integrators: the jar filename changed again, and `fabric.mod.json`'s version
// string follows it (processResources expands ${version}).
version = project.mod_version + "-" + project.minecraft_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"blockbuster" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}

	accessWidenerPath.set(file("src/main/resources/blockbuster.accesswidener"))
}

// S21 P218: the only third-party mod maven this build talks to. `exclusiveContent`
// pins it to the `maven.modrinth` group so no other coordinate can ever be
// resolved through it (and so Fabric/Mojang lookups never round-trip to Modrinth).
repositories {
	exclusiveContent {
		forRepository {
			maven {
				name = "Modrinth"
				url = "https://api.modrinth.com/maven"
			}
		}
		filter {
			includeGroup "maven.modrinth"
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

	// Bundled javax.vecmath (P13 decision): legacy McLib/Blockbuster matrix math
	// keeps its vecmath signatures for diff-ability against .tools/legacy-src;
	// JOML conversion happens only at the MC render boundary. `include` nests
	// the jar inside the mod jar (jar-in-jar).
	implementation "javax.vecmath:vecmath:1.5.2"
	include "javax.vecmath:vecmath:1.5.2"

	// S21 P218 — Iris, compile-only, pinned to exactly one build.
	//
	// This is the *first and only* third-party mod dependency in the build, and
	// it deliberately breaks the reflection-only precedent P217/P217.1 set
	// (S21 open questions 2 and 9). Shader-bound Aperture curves have to *read*
	// Iris types — `CustomUniforms.Builder`, `CachedUniform`, the jcpp
	// preprocessor — which a `java.lang.reflect.Proxy` cannot fake the way
	// `IrisPbrGifBridge` fakes `PBRTextureLoader`.
	//
	// `modClientCompileOnly`, not `modImplementation`: Iris is never on the
	// runtime classpath, is not bundled, and is not declared in
	// `fabric.mod.json` `depends`. Everything that touches an Iris type sits
	// behind `blockbuster.iris.mixins.json`, whose `IrisMixinPlugin` refuses to
	// apply a single mixin unless Iris is loaded *and* every pinned internal
	// resolves — so a mismatched Iris build disables shader curves and logs,
	// exactly like legacy's "Do not support this version of Optifine!".
	//
	// Version pinning (open question 2, closed): ONE version, not a compat
	// matrix. `iris_version` in gradle.properties is the single place to bump;
	// `IrisMixinPlugin.IRIS_VERSION` pins the same string.
	//
	// Build cost, measured: the artifact is already in the shared Gradle cache
	// and Loom's remap output is cached under `.gradle/loom-cache`, so a warm
	// build pays nothing. A cold build pays one ~4 MB Modrinth fetch plus one
	// Loom source-remap of that jar (intermediary -> yarn), which is a one-off
	// of roughly 20-30 s on this machine and never recurs.
	modClientCompileOnly "maven.modrinth:iris:${project.iris_version}"

	testImplementation platform("org.junit:junit-bom:5.10.2")
	testImplementation "org.junit.jupiter:junit-jupiter"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

// CDC §2.7: headless unit tests (no OpenGL) live in src/test and run with
// `build` through `check`.
test {
	useJUnitPlatform()
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 17
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_17
	targetCompatibility = JavaVersion.VERSION_17
}

jar {
	// P216 release freeze: deterministic archives so a clean rebuild is
	// byte-reproducible (no embedded timestamps, stable entry order).
	preserveFileTimestamps = false
	reproducibleFileOrder = true

	// GPLv3 requires the license text to travel with the combined work; the
	// third-party attribution (McLib/Metamorph MIT, Aperture GPLv3, open_imaging
	// Apache-2.0) ships alongside it.
	from("LICENSE") {
		rename { "${it}_${project.base.archivesName.get()}"}
	}
	from("ATTRIBUTION.md") {
		rename { "${it}_${project.base.archivesName.get()}"}
	}
}

// DEV convenience: `gradlew installToInstance` builds the mod and installs the
// remapped jar into the Prism test instance named by `instance.dir` in
// `local.properties` (machine-specific, git-ignored). The previous Blockbuster
// jar is moved to `<game dir>/mods_backup/` with a timestamp; no other mod is
// touched. Replaces `installToMultiMC`, which targeted a Linux MultiMC path.
def localProperties = new Properties()
def localPropertiesFile = file('local.properties')

if (localPropertiesFile.isFile()) {
	localPropertiesFile.withReader('UTF-8') { localProperties.load(it) }
}

// Windows refuses to rename a file another process holds open: a running
// Minecraft keeps its mod jars and logs/latest.log open, so a rename that
// fails means the game is running. The rename is undone immediately.
def isLockedByProcess = { File file ->
	def probe = new File(file.parentFile, file.name + '.lockcheck')

	if (!file.renameTo(probe)) {
		return true
	}

	if (!probe.renameTo(file)) {
		throw new GradleException("Impossible de retablir ${file} (renomme en ${probe.name}) : renomme-le a la main.")
	}

	return false
}

tasks.register('installToInstance') {
	group = 'blockbuster'
	description = 'Builds the mod and installs it into the test instance from local.properties (instance.dir).'
	dependsOn tasks.named('build')

	doLast {
		def instanceDir = localProperties.getProperty('instance.dir')

		if (!instanceDir) {
			throw new GradleException("instance.dir manquant. Cree local.properties a la racine du projet avec :\n" +
				"  instance.dir=E:/PrismLauncher/instances/<instance>")
		}

		/* Prism keeps the game directory in <instance>/minecraft (older instances: .minecraft). */
		def gameDir = ['minecraft', '.minecraft'].collect { new File(instanceDir, it) }.find { it.isDirectory() }

		if (gameDir == null) {
			throw new GradleException("Aucun dossier minecraft/ dans ${instanceDir} : verifie instance.dir dans local.properties.")
		}

		def modsDir = new File(gameDir, 'mods')
		def backupDir = new File(gameDir, 'mods_backup')
		def jarFile = tasks.remapJar.archiveFile.get().asFile

		modsDir.mkdirs()

		def oldJars = modsDir.listFiles().findAll {
			it.isFile() && it.name.startsWith('blockbuster-') && it.name.endsWith('.jar')
		}
		def locked = (oldJars + [new File(gameDir, 'logs/latest.log')]).findAll { it.isFile() && isLockedByProcess(it) }

		if (!locked.isEmpty()) {
			throw new GradleException("Minecraft semble lance : ${locked*.name.join(', ')} est verrouille. " +
				"Ferme le jeu puis relance installToInstance. Rien n a ete copie.")
		}

		def stamp = new Date().format('yyyy-MM-dd_HH-mm-ss')

		oldJars.each { old ->
			backupDir.mkdirs()

			def backup = new File(backupDir, "${stamp}_${old.name}")

			java.nio.file.Files.move(old.toPath(), backup.toPath())
			println "Sauvegarde : ${old.name} -> mods_backup/${backup.name}"
		}

		java.nio.file.Files.copy(jarFile.toPath(), new File(modsDir, jarFile.name).toPath(),
			java.nio.file.StandardCopyOption.REPLACE_EXISTING)
		println "Installe : ${jarFile.name} -> ${modsDir}"
	}
}
